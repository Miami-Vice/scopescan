name: ScopeScan

options:
  bundleIdPrefix: dev.scopescan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ScopeScanCore:
    path: ScopeScanCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: "Automatic"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  ScopeScan:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ScopeScanCore
        product: ScopeScanCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ScopeScan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: >-
          ScopeScan probes the local network you own to inventory exposed
          services and weak transport configuration.
        NSLocationWhenInUseUsageDescription: >-
          ScopeScan reads the current Wi-Fi network name and security type so it
          can report on the network you are auditing.
        NSFaceIDUsageDescription: >-
          ScopeScan checks whether biometric unlock is available on this device.
        # Lets the jailbreak check ask whether a package-manager app is installed.
        # Without these declarations canOpenURL always returns false for them.
        LSApplicationQueriesSchemes:
          - cydia
          - sileo
          - zbra
        NSBonjourServices:
          - _services._dns-sd._udp
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _ftp._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _ipp._tcp
          - _printer._tcp
          - _scanner._tcp
          - _rtsp._tcp
          - _http-alt._tcp
          - _mqtt._tcp
          - _workstation._tcp
          - _device-info._tcp
          - _raop._tcp
          - _airplay._tcp
          - _googlecast._tcp
          - _companion-link._tcp
          - _homekit._tcp
          - _hap._tcp
          - _sleep-proxy._udp
          - _nfs._tcp
          - _ldap._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scopescan.app
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ScopeScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ScopeScanAppTests
    dependencies:
      - target: ScopeScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scopescan.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ScopeScan:
    build:
      targets:
        ScopeScan: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ScopeScanTests
