name: core

on:
  push:
    branches: [main]
    paths:
      - "ScopeScanCore/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "ScopeScanCore/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test core
        run: swift test --package-path ScopeScanCore
