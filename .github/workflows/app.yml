name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve simulator
        id: dest
        run: echo "destination=$(./scripts/ci-destination.sh)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ScopeScan.xcodeproj \
            -scheme ScopeScan \
            -configuration Debug \
            -destination '${{ steps.dest.outputs.destination }}' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project ScopeScan.xcodeproj \
            -scheme ScopeScan \
            -configuration Debug \
            -destination '${{ steps.dest.outputs.destination }}' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
